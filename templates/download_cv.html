{% extends "base.html" %}
{% block content %}
    <h2>📥 Download My Curriculum Vitae</h2>
    <p>Please enter your name and email address below. Your download of my professional PDF CV will begin immediately upon submission.</p>

    <div class="download-form-container">
        <form method="POST">
            <label for="name"><strong>Your Name / Company Name:</strong></label>
            <input type="text" id="name" name="name" placeholder="Eg: Ali Raheel from Antares Vision Group" required>

            <label for="email"><strong>Your Professional Email Address:</strong></label>
            <input type="email" id="email" name="email" placeholder="recruiter@company.com" required>

            <button type="submit" style="margin-top: 15px; width: 100%; font-size: 16px;">
                Download PDF 📄
            </button>
        </form>
    </div>
{% endblock %}
